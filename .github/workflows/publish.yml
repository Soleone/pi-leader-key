name: Publish to npm

# Fires on version tags (v*). Publishes via OIDC trusted publishing —
# no tokens: the package's trusted-publisher entry on npmjs.com must
# name this repo + this filename and allow `npm publish`.
on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - run: npm ci
      - run: npm test
      # npm bundled with node may predate OIDC publish support (11.5.1+)
      - run: npm install -g npm@latest
      # setup-node exports github.token and writes an empty _authToken into
      # .npmrc; either would steer npm away from OIDC auth
      - run: |
          unset NODE_AUTH_TOKEN
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          if ! npm publish; then
            logf=$(ls -t /home/runner/.npm/_logs/*-debug-0.log | head -1)
            grep -iE 'oidc|exchange' "$logf" | head -20 || true
            exit 1
          fi
